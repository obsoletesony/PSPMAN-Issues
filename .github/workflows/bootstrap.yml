name: Bootstrap PSPMAN tracker files

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap.yml"
      - "scripts/bootstrap_tracker.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize the tracker files
        run: python scripts/bootstrap_tracker.py

      - name: Commit the tracker files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/ISSUE_TEMPLATE .github/labels.json CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md scripts/sync-labels.js scripts/triage.js scripts/validate_issue_forms.py test/triage.test.js
          if git diff --cached --quiet; then
            echo "Tracker files already materialized."
          else
            git commit -m "Build PSPMAN public issue workflow"
            git push
          fi
