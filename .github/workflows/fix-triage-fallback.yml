name: Fix PSPMAN triage type fallback

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-triage-fallback.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve the form type when a reporter edits the title prefix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const triagePath = "scripts/triage.js";
          let triage = fs.readFileSync(triagePath, "utf8");
          const before = '  const issueType = classifyType(title);';
          const after = `  const issueType =
            classifyType(title) ||
            existing.find((label) => label.startsWith("type:")) ||
            null;`;
          if (!triage.includes(before)) {
            throw new Error("Expected issueType assignment was not found");
          }
          triage = triage.replace(before, after);
          fs.writeFileSync(triagePath, triage);

          const testPath = "test/triage.test.js";
          let tests = fs.readFileSync(testPath, "utf8");
          const addition = `

test("preserves the form type when a reporter removes the title prefix", () => {
  const body = \`### PSP model

PSP-2000

### Where did the problem happen?

Startup, library scan, or cache

### Diagnostic log status

Not sure
\`;
  const labels = classifyIssue(
    issue({
      title: "PSPMAN freezes while scanning",
      body,
      labels: ["type: bug", "status: needs triage"],
    })
  );

  assert.ok(labels.includes("type: bug"));
  assert.ok(labels.includes("area: startup"));
  assert.ok(labels.includes("model: PSP-2000"));
});
`;
          if (tests.includes("preserves the form type when a reporter removes")) {
            throw new Error("Fallback test already exists");
          }
          fs.writeFileSync(testPath, tests.trimEnd() + addition);
          NODE

      - name: Run triage tests
        run: node --test test/triage.test.js

      - name: Commit the triage correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/triage.js test/triage.test.js
          git commit -m "Preserve issue type after title edits"
          git push
