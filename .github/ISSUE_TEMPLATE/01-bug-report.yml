name: Report a PSPMAN problem
description: Report a crash, freeze, playback problem, missing artwork, control problem, or other unexpected behavior.
title: "[Bug] "
labels:
  - "type: bug"
  - "status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test PSPMAN.

        **No technical experience is required.** Give us what you know and write **“I don't know”** where you are unsure.

        This report and every attachment will be public. Do not upload copyrighted music. PSPMAN does not send diagnostic information automatically.

  - type: dropdown
    id: psp-model
    attributes:
      label: PSP model
      description: Choose the closest match. The model family is enough if you do not know the exact regional number.
      options:
        - PSP-1000
        - PSP-2000
        - PSP-3000
        - PSP Go (PSP-N1000)
        - PSP Street (PSP-E1000)
        - PPSSPP or another emulator
        - Other
        - Not sure
    validations:
      required: true

  - type: input
    id: exact-model
    attributes:
      label: Exact model number
      description: Optional. This is printed on the PSP, for example PSP-2001 or PSP-3004.
      placeholder: PSP-2001, or I don't know
    validations:
      required: false

  - type: input
    id: firmware
    attributes:
      label: System software or custom firmware
      description: Include both when possible.
      placeholder: 6.61 ARK-4, 6.60 PRO-C2, 5.00 M33-4, official 6.61, or I don't know
    validations:
      required: true

  - type: input
    id: pspman-version
    attributes:
      label: PSPMAN version
      description: You can find this in PSPMAN's About screen. Write “I don't know” if you cannot open it.
      placeholder: Public Alpha version shown in About
    validations:
      required: true

  - type: dropdown
    id: problem-area
    attributes:
      label: Where did the problem happen?
      options:
        - Installation or launching from the XMB
        - Startup, library scan, or cache
        - Library browsing, sorting, or search
        - Starting playback or no sound
        - Playback interruption, noise, or incorrect audio
        - Pause, resume, seek, previous, or next
        - Queue, playlists, or favorites
        - Album artwork or cover loading
        - Cassette view or another visual
        - Controls or interface navigation
        - Performance, slowdown, or delayed response
        - Closing PSPMAN or returning to the XMB
        - Somewhere else
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw or heard. Plain language is fine.
      placeholder: PSPMAN opened normally. I selected a song, the cover appeared, and then...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Optional. Tell us what you expected PSPMAN to do instead.
      placeholder: I expected the next song to begin.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List what you did before the problem. Tell us what you remember even if you cannot reproduce it.
      placeholder: |
        1. Opened PSPMAN
        2. Opened All Songs
        3. Selected ...
        4. Pressed ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Most of the time
        - Sometimes
        - It happened once
        - I could not reproduce it
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: playback-result
    attributes:
      label: What happened to the song?
      description: Choose “Not applicable” for installation, navigation, or non-playback problems.
      options:
        - It played normally
        - It did not start
        - It started and then stopped
        - It continued playing but something else broke
        - It played with noise, gaps, or incorrect sound
        - There was no sound
        - Not applicable
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: cover-result
    attributes:
      label: What happened to the cover?
      description: Choose “Not applicable” when artwork is unrelated.
      options:
        - It appeared normally
        - It did not appear
        - It appeared late
        - It was incorrect or corrupted
        - Not applicable
        - Not sure
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Diagnostic log

        The file is named **`PSPMAN-HW-DIAG.log`**. Open the Memory Stick on a computer and look at its top level, beside the **`PSP`** folder.

        **Copy it before starting PSPMAN again. The next launch replaces the previous log.**

        Reports are public. Review the log before uploading it because it may contain song names, file names, or paths.

  - type: dropdown
    id: log-status
    attributes:
      label: Diagnostic log status
      options:
        - I attached PSPMAN-HW-DIAG.log below
        - I found it but prefer not to publish it
        - I could not find it
        - PSPMAN did not create it
        - It was replaced by another launch
        - It is not relevant to this report
        - Not sure
    validations:
      required: true

  - type: upload
    id: diagnostic-log
    attributes:
      label: Attach PSPMAN-HW-DIAG.log
      description: Strongly recommended, but not required. Upload only the .log file, not your music or Memory Stick contents.
    validations:
      required: false
      accept: ".log,.txt"

  - type: textarea
    id: affected-file
    attributes:
      label: Affected song or cover details
      description: Optional. Do not upload the music file. Include whatever you know.
      placeholder: |
        Artist and song:
        FLAC file size:
        Sample rate / bit depth / channels:
        Cover format:
        Cover dimensions:
        Embedded cover file size:
    validations:
      required: false

  - type: upload
    id: media
    attributes:
      label: Photo, screenshot, or short video
      description: Optional. A photo of the PSP screen can be useful when the exact error is difficult to describe.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else
      description: Optional. Add any detail that may help, including whether the same file works in another player.
    validations:
      required: false

  - type: checkboxes
    id: public-confirmation
    attributes:
      label: Public report confirmation
      options:
        - label: I understand that this report and any files I attach are public.
          required: true
        - label: I reviewed anything I chose to attach and removed information I do not want to publish.
          required: true
        - label: I did not upload copyrighted music.
          required: true
