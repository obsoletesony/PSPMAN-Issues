name: Ask for help
description: Stuck, or not sure whether something is a bug? Start here.
title: "[Help] "
labels:
  - "type: help"
  - "status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Not sure whether it is a bug? Use this form.

        Tell us what you are trying to do and where it goes wrong. If you do not know your firmware or PSPMAN version, leave it blank.

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      placeholder: I am trying to install PSPMAN / play my music / find the diagnostic log...
    validations:
      required: true

  - type: textarea
    id: stuck
    attributes:
      label: Where are you stuck?
      description: Include any message shown on the PSP.
      placeholder: Tell us what you see and what happens when you try.
    validations:
      required: true

  - type: dropdown
    id: psp-model
    attributes:
      label: PSP model
      options:
        - PSP-1000
        - PSP-2000
        - PSP-3000
        - PSP Go (PSP-N1000)
        - PSP Street (PSP-E1000)
        - PPSSPP or another emulator
        - Other
        - Not sure
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: System software or custom firmware
      placeholder: 6.61 ARK-4, 6.60 PRO-C2, official 6.61, or I don't know
    validations:
      required: false

  - type: input
    id: pspman-version
    attributes:
      label: PSPMAN version
      placeholder: Version shown in About, or I don't know
    validations:
      required: false

  - type: upload
    id: media
    attributes:
      label: Photo or screenshot
      description: Optional. A phone photo of the PSP screen is fine.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp"

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: Optional.
      placeholder: I copied the folder again, restarted the PSP, tried another Memory Stick...
    validations:
      required: false

  - type: checkboxes
    id: public-confirmation
    attributes:
      label: Before submitting
      options:
        - label: I understand that this issue and its attachments are public.
          required: true
        - label: I did not upload copyrighted music or private information.
          required: true
