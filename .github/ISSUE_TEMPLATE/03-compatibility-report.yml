name: Share a compatibility result
description: Tested PSPMAN on a PSP or firmware combo? Add the result here.
title: "[Compatibility] "
labels:
  - "type: compatibility"
  - "status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Tested PSPMAN on a PSP or firmware combo? Add the result here.

        Successful tests matter too. You do not need to test everything.

        PSP-1000 results are welcome, but the model remains experimental and is not officially supported.

  - type: dropdown
    id: psp-model
    attributes:
      label: PSP model
      options:
        - PSP-1000 (experimental / unsupported)
        - PSP-2000
        - PSP-3000
        - PSP Go (PSP-N1000)
        - PSP Street (PSP-E1000)
        - Not sure
    validations:
      required: true

  - type: input
    id: exact-model
    attributes:
      label: Exact model number
      description: Optional. For example PSP-2001 or PSP-3004.
      placeholder: PSP-2001
    validations:
      required: false

  - type: input
    id: firmware
    attributes:
      label: System software or custom firmware
      placeholder: 6.61 ARK-4, 6.60 PRO-C2, official 6.61, or I don't know
    validations:
      required: true

  - type: input
    id: pspman-version
    attributes:
      label: PSPMAN version
      description: Shown in About.
      placeholder: Public Alpha version
    validations:
      required: true

  - type: dropdown
    id: overall-result
    attributes:
      label: Overall result
      options:
        - Works normally
        - Works with a minor problem
        - Works with a serious problem
        - Opens but cannot play music
        - Does not open
        - Appears as corrupted data
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: tested-areas
    attributes:
      label: What did you test?
      description: Select everything you tried.
      multiple: true
      options:
        - Installation and XMB launch
        - Cold startup and library scan
        - Warm startup using the cache
        - Library browsing
        - FLAC playback
        - Pause and resume
        - Seek
        - Previous and next
        - Natural track advance
        - Album artwork
        - Queue
        - Playlists and favorites
        - Cassette view
        - HOME shutdown
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Result details
      description: What worked? Anything odd?
      placeholder: PSPMAN launched, found 215 tracks, played several FLAC files, and returned to the XMB normally.
    validations:
      required: true

  - type: input
    id: library-size
    attributes:
      label: Approximate library size
      description: Optional. Track count and rough storage used.
      placeholder: 215 tracks, about 12 GB
    validations:
      required: false

  - type: dropdown
    id: log-status
    attributes:
      label: Diagnostic log
      options:
        - Attached below
        - Available but not attached
        - Could not find it
        - Not needed because everything worked
        - Not sure
    validations:
      required: true

  - type: upload
    id: diagnostic-log
    attributes:
      label: Attach PSPMAN-HW-DIAG.log
      description: Optional. The issue is public, and the log may contain song names, file names, or paths. Review it before uploading, or submit without it.
    validations:
      required: false
      accept: ".log,.txt"

  - type: upload
    id: media
    attributes:
      label: Photo or video
      description: Optional. A photo of PSPMAN running on the PSP is enough.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"

  - type: checkboxes
    id: public-confirmation
    attributes:
      label: Before submitting
      options:
        - label: I understand that this issue and its attachments are public.
          required: true
        - label: I checked anything I attached for information I do not want public.
          required: true
        - label: I did not upload copyrighted music.
          required: true
